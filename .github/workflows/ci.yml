name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Install X11 headers (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev
      - run: go build ./...
      - run: go vet ./...
      - name: Test (on failure, emit tail as annotations — readable via API)
        shell: bash
        run: |
          if go test -v ./... 2>&1 | tee /tmp/test.log; then
            exit 0
          fi
          tail -c 4000 /tmp/test.log | while IFS= read -r line; do
            echo "::error::$line"
          done
          exit 1
