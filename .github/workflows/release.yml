name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
            gui: true
          - goos: windows
            goarch: arm64
            ext: .exe
            gui: true
          - goos: darwin
            goarch: amd64
            ext: ""
            gui: false
          - goos: darwin
            goarch: arm64
            ext: ""
            gui: false
          - goos: linux
            goarch: amd64
            ext: ""
            gui: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          LDFLAGS="-s -w"
          if [ "$GOOS" = "windows" ]; then
            LDFLAGS="$LDFLAGS -H windowsgui"
          fi
          NAME="monctl-${GOOS}-${GOARCH}${{ matrix.ext }}"
          # console build for windows (monctl.exe), gui-silent build alongside (monctl-tray.exe)
          go build -trimpath -ldflags "$LDFLAGS" -o "dist/monctl-${GOOS}-${GOARCH}${{ matrix.ext }}" .
          if [ "${{ matrix.gui }}" = "true" ]; then
            go build -trimpath -ldflags "-s -w" -o "dist/monctl-tray-${GOOS}-${GOARCH}${{ matrix.ext }}" .
          fi
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
